# OpenAPI description of every route the api-gateway exposes, rendered by
# Swagger UI at /docs. Keep in sync with the proxy routes in src/app.ts and
# the handlers in each service. Examples use the seeded dev data.
openapi: 3.0.3
info:
  title: Food Delivery API
  version: 1.0.0
  description: |
    Every request goes through the **api-gateway**, which routes it to the owning microservice.

    **To call protected endpoints:** run `POST /login` (e.g. `jamie@example.com` / `password123`),
    copy the `token` from the response, click **Authorize** and paste it.
    For the **Owner** endpoints, log in as a restaurant owner instead
    (e.g. `sam@mariospizzeria.com` / `password123`).

    **Order flow (event-driven over RabbitMQ):** `POST /orders` publishes `order.created` →
    payment-service creates a `PENDING` payment for it (find it with `GET /payments?orderId=…`) →
    the customer pays it with `POST /payments/{id}/pay` ("Pay now"), which publishes
    `payment.succeeded` or `payment.failed` → order-service moves the order to `CONFIRMED` or
    `CANCELLED` → restaurant-service publishes `restaurant.order_received`. The flow is
    asynchronous, so poll `GET /orders/{id}` for the outcome. Payments over 100.00 are declined
    by the simulated payment provider, so the failure path can be tested too.

    **Restaurant side:** a paid (`CONFIRMED`) order shows up in `GET /owner/orders`. The owner
    accepts it (`PREPARING`, publishes `order.preparing`), marks it ready (`READY`, publishes
    `order.ready`) or rejects it (`CANCELLED` and refunded). Customer and owner both get every
    status change pushed over the notification websocket.
servers:
  - url: /
    description: This api-gateway
tags:
  - name: Gateway
  - name: Auth
    description: user-service
  - name: Restaurants
    description: restaurant-service
  - name: Orders
    description: order-service
  - name: Payments
    description: payment-service
  - name: Owner restaurants
    description: restaurant-service, restaurant owners only
  - name: Owner orders
    description: order-service, restaurant owners only

paths:
  /health:
    get:
      tags: [Gateway]
      summary: Gateway health check
      responses:
        '200': { description: Gateway is up }

  /register:
    post:
      tags: [Auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Credentials'
                - type: object
                  properties:
                    name: { type: string }
            example: { email: new.customer@example.com, password: password123, name: New Customer }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /register/restaurant-owner:
    post:
      tags: [Auth]
      summary: Register a restaurant owner account
      description: >
        Used by the restaurant-app's sign-up. The new owner is signed in straight
        away and then registers their restaurant with `POST /owner/restaurants`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Credentials'
                - type: object
                  properties:
                    name: { type: string }
            example: { email: chef@pastacorner.com, password: password123, name: Chef }
      responses:
        '201':
          description: Account created, with role `RESTAURANT_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Logged in — paste `token` into the Authorize dialog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth sign-in
      description: Browser redirect flow — open it in a browser tab; it cannot complete inside Swagger UI.
      responses:
        '302': { description: Redirect to Google }

  /restaurants:
    get:
      tags: [Restaurants]
      summary: List restaurants
      parameters:
        - name: search
          in: query
          description: Case-insensitive match on name or cuisine
          schema: { type: string }
      responses:
        '200':
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RestaurantSummary' }

  /restaurants/{id}:
    get:
      tags: [Restaurants]
      summary: Get a restaurant with its menu
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: 33333333-3333-3333-3333-333333333331 }
      responses:
        '200':
          description: Restaurant and menu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    get:
      tags: [Orders]
      summary: List the logged-in customer's orders
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Orders]
      summary: Place an order
      description: >
        Prices are looked up from restaurant-service. The order starts as
        `PLACED` and payment-service creates a `PENDING` payment for it, which
        the customer pays with `POST /payments/{id}/pay`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: Order placed and `order.created` published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: A menu item is unknown or unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503':
          description: Event bus unreachable; the order was not placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of your orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: >
        Allowed while `PLACED` or `CONFIRMED`. Publishes `order.cancelled`;
        payment-service then refunds a payment that already succeeded, or
        cancels one that was still pending.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments:
    get:
      tags: [Payments]
      summary: List the logged-in customer's payments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: query
          description: Only payments for this order
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payments, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get one of your payments
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/pay:
    post:
      tags: [Payments]
      summary: Pay a pending payment ("Pay now")
      description: >
        Charges the payment with the simulated provider, which approves amounts
        up to 100.00 and declines anything larger. Publishes `payment.succeeded`
        or `payment.failed`; order-service then confirms or cancels the order.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The payment, now `SUCCEEDED` or `FAILED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The payment isn't pending (already paid, or its order was cancelled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The outcome couldn't be published; nothing was charged, try again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /owner/restaurants:
    get:
      tags: [Owner restaurants]
      summary: List your restaurants, with their menus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Your restaurants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RestaurantDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Owner restaurants]
      summary: Register a new restaurant
      description: New restaurants start closed; open them with `PATCH` once the menu is set up.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRestaurant' }
      responses:
        '201':
          description: Created; publishes `restaurant.created`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /owner/restaurants/{id}:
    get:
      tags: [Owner restaurants]
      summary: Get one of your restaurants
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
      responses:
        '200':
          description: The restaurant and its menu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Owner restaurants]
      summary: Update details, or open / close the restaurant
      description: Send only the fields to change. Publishes `restaurant.updated`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantUpdate' }
            example: { isOpen: false }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /owner/restaurants/{id}/menu-items:
    post:
      tags: [Owner restaurants]
      summary: Add a menu item
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMenuItem' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /owner/restaurants/{id}/menu-items/{itemId}:
    patch:
      tags: [Owner restaurants]
      summary: Edit a menu item, or mark it (un)available
      description: Send only the fields to change.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/MenuItemIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemUpdate' }
            example: { isAvailable: false }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Owner restaurants]
      summary: Remove a menu item
      description: Past orders keep their own copy of the item's name and price.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/MenuItemIdPath' }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /owner/orders:
    get:
      tags: [Owner orders]
      summary: List paid orders for your restaurants
      description: Oldest first. Orders still awaiting payment, or whose payment failed, are never shown.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses, e.g. `CONFIRMED,PREPARING,READY`
          schema: { type: string, example: 'CONFIRMED,PREPARING,READY' }
        - name: restaurantId
          in: query
          description: Only this restaurant's orders
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /owner/orders/{id}:
    get:
      tags: [Owner orders]
      summary: Get one of your restaurants' orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /owner/orders/{id}/accept:
    post:
      tags: [Owner orders]
      summary: Accept an order and start preparing it
      description: '`CONFIRMED` → `PREPARING`. Publishes `order.preparing`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { $ref: '#/components/responses/OwnerOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /owner/orders/{id}/ready:
    post:
      tags: [Owner orders]
      summary: Mark an order ready for pickup
      description: '`PREPARING` → `READY`. Publishes `order.ready`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { $ref: '#/components/responses/OwnerOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /owner/orders/{id}/reject:
    post:
      tags: [Owner orders]
      summary: Reject an order
      description: >
        Allowed while `CONFIRMED` or `PREPARING`. The order is `CANCELLED`,
        `order.cancelled` is published and payment-service refunds it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
            example: { reason: 'Out of mozzarella' }
      responses:
        '200': { $ref: '#/components/responses/OwnerOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RestaurantIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, example: 33333333-3333-3333-3333-333333333331 }
    MenuItemIdPath:
      name: itemId
      in: path
      required: true
      schema: { type: string, example: 44444444-4444-4444-4444-444444444441 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Logged in, but not as a restaurant owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OwnerOrder:
      description: The order in its new status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Order' }
    Upstream:
      description: A downstream service or the event bus is unreachable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: jamie@example.com }
        password: { type: string, example: password123 }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string, nullable: true }
            role: { type: string, enum: [CUSTOMER, RESTAURANT_OWNER, COURIER, ADMIN] }

    RestaurantSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cuisine: { type: string, nullable: true }
        address: { type: string }
        isOpen: { type: boolean }

    MenuItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: string, example: '12.5' }
        isAvailable: { type: boolean }

    RestaurantDetail:
      allOf:
        - $ref: '#/components/schemas/RestaurantSummary'
        - type: object
          properties:
            description: { type: string, nullable: true }
            menuItems:
              type: array
              items: { $ref: '#/components/schemas/MenuItem' }

    NewRestaurant:
      type: object
      required: [name, address]
      properties:
        name: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 500 }
        cuisine: { type: string, nullable: true, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 500 }
      example: { name: 'Pasta Corner', address: '3 Canal Road', cuisine: 'Italian' }

    RestaurantUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 500 }
        cuisine: { type: string, nullable: true, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 500 }
        isOpen: { type: boolean }

    NewMenuItem:
      type: object
      required: [name, price]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 500 }
        price: { type: number, minimum: 0.01, maximum: 10000, description: 'At most 2 decimals' }
        isAvailable: { type: boolean, default: true }
      example: { name: 'Calzone', description: 'Folded pizza with ham and ricotta', price: 13.5 }

    MenuItemUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 500 }
        price: { type: number, minimum: 0.01, maximum: 10000 }
        isAvailable: { type: boolean }

    CreateOrder:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menuItemId, quantity]
            properties:
              menuItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
      example:
        restaurantId: 33333333-3333-3333-3333-333333333331
        items:
          - { menuItemId: 44444444-4444-4444-4444-444444444441, quantity: 2 }
          - { menuItemId: 44444444-4444-4444-4444-444444444442, quantity: 1 }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        status:
          type: string
          enum: [PLACED, CONFIRMED, PREPARING, READY, PICKED_UP, DELIVERED, COMPLETED, CANCELLED]
        totalAmount: { type: string, example: '29.5' }
        confirmedAt: { type: string, format: date-time, nullable: true, description: 'When payment succeeded' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              menuItemId: { type: string, format: uuid }
              name: { type: string }
              unitPrice: { type: string, example: '12.5' }
              quantity: { type: integer }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
