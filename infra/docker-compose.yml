services:
  postgres:
    image: postgres:16-alpine
    container_name: food-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: user_service_db,restaurant_service_db,order_service_db,payment_service_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      # The repository root, so the image can include libs/Delivery.Common.
      context: ..
      dockerfile: services/user-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/user_service_db?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: dev-local-jwt-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  restaurant-service:
    build:
      # The repository root, so the image can include libs/Delivery.Common.
      context: ..
      dockerfile: services/restaurant-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/restaurant_service_db?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      # The repository root, so the image can include libs/Delivery.Common.
      context: ..
      dockerfile: services/order-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_service_db?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
      RESTAURANT_SERVICE_URL: http://restaurant-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      # The repository root, so the image can include libs/Delivery.Common.
      context: ..
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_service_db?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
      # Simulated payment provider declines any order total above this.
      PAYMENT_DECLINE_ABOVE: 100
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      # The repository root, so the image can include libs/Delivery.Common.
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notification_service_db?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      # The repository root, so the image can include libs/Delivery.Common.
      context: ..
      dockerfile: gateway/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3001
      RESTAURANT_SERVICE_URL: http://restaurant-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      JWT_SECRET: dev-local-jwt-secret-change-me
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  pgdata:
