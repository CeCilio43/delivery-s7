name: api-gateway CI/CD

on:
  pull_request:
    paths:
      - 'gateway/api-gateway/**'
      - 'libs/Delivery.Common/**'
      - 'libs/Delivery.Testing/**'
      - 'Directory.Build.props'
      - 'global.json'
  push:
    branches: [main]
    paths:
      - 'gateway/api-gateway/**'
      - 'libs/Delivery.Common/**'
      - 'libs/Delivery.Testing/**'
      - 'Directory.Build.props'
      - 'global.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format gateway/api-gateway/tests --verify-no-changes
      - run: dotnet test --project gateway/api-gateway/tests

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          # The repository root, so the image can include libs/Delivery.Common.
          context: .
          file: gateway/api-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/api-gateway:latest
            ghcr.io/${{ steps.owner.outputs.name }}/api-gateway:${{ github.sha }}
