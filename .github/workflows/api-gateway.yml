name: api-gateway CI/CD

on:
  pull_request:
    paths:
      - 'gateway/api-gateway/**'
  push:
    branches: [main]
    paths:
      - 'gateway/api-gateway/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gateway/api-gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: gateway/api-gateway
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/api-gateway:latest
            ghcr.io/${{ steps.owner.outputs.name }}/api-gateway:${{ github.sha }}
