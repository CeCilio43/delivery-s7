name: customer-app CI/CD

on:
  pull_request:
    paths:
      - 'frontend/customer-app/**'
  push:
    branches: [main]
    paths:
      - 'frontend/customer-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/customer-app/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      # NOTE: no test step yet — add `npm test` here once Vitest +
      # React Testing Library are set up for this app.
      - run: npm run build

  build-and-push:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: frontend/customer-app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/customer-app:latest
            ghcr.io/${{ github.repository_owner }}/customer-app:${{ github.sha }}
